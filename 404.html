<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — 页面未找到 · Juicy Player</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      --accent: #ff6b35;
      --accent-light: #ff8c5a;
      --bg: #0f0f1a;
      --text: #e8e8f0;
      --text-secondary: #8b8ba0;
      --border: rgba(255,255,255,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      overflow: hidden;
    }
    .bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(255,107,53,0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(255,140,90,0.1) 0%, transparent 50%);
      z-index: 0;
    }
    .wrap { position: relative; z-index: 1; max-width: 480px; }
    .code {
      font-size: 120px;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent), var(--accent-light), #ffd93d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    .emoji { font-size: 56px; margin-bottom: 16px; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 12px; }
    p { color: var(--text-secondary); font-size: 16px; line-height: 1.7; margin-bottom: 32px; }
    a.btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 32px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: #fff;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(255,107,53,0.4);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    a.btn:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(255,107,53,0.5); }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">
    <div class="emoji">🎵</div>
    <div class="code">404</div>
    <h1>这个页面走丢了</h1>
    <p>你访问的页面不存在或已被移动。<br>返回首页，继续享受你的音乐吧。</p>
    <a class="btn" href="/JuicyPlayer.github.io/">返回首页 →</a>
  </div>
</body>
</html>
